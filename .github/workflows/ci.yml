name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - name: Check formatting
        if: github.event_name == 'pull_request'
        run: npm run format:check
      - run: npm run lint:md
      - run: npm test
      - run: npx astro check
      - run: npm run build
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has-license: ${{ steps.check-license.outputs.has-license }}
    steps:
      - name: Check for gitleaks license
        id: check-license
        run: |
          if [ -n "${{ secrets.GITLEAKS_LICENSE }}" ]; then
            echo "has-license=true" >> $GITHUB_OUTPUT
            echo "✅ GITLEAKS_LICENSE found, proceeding with secret scan"
          else
            echo "has-license=false" >> $GITHUB_OUTPUT
            echo "ℹ️ GITLEAKS_LICENSE not set, skipping secret scan"
            echo "To enable: request free license at https://gitleaks.io and add as GITLEAKS_LICENSE secret"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check-license.outputs.has-license == 'true'
        with:
          fetch-depth: 0
      - name: Run gitleaks secret scan
        if: steps.check-license.outputs.has-license == 'true'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
